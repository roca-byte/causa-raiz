<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f5c6e">
  <meta name="description" content="Análisis de causa raíz para planta: Ishikawa 6M, 5 por qué, plan de acción, eficacia y Pareto.">
  <title>Análisis Causa Raíz</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="q-mark" aria-hidden="true"><img src="icons/qualityos.svg" alt=""></span>
      <div class="brand-text">
        <strong>Análisis Causa Raíz</strong>
      </div>
    </div>
    <div id="topStatus" class="top-status"></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Secciones">
    <button type="button" data-tab="casos" class="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h13M16 12l-4-4M16 12l-4 4M8 5l3 7-3 7M19 7v10"/></svg>
      Casos
    </button>
    <button type="button" data-tab="pareto">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V6M10 20v-9M16 20v-5M3 20h18M4 5l6 3 6 2 5 1"/></svg>
      Pareto
    </button>
    <button type="button" data-tab="ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
      Ajustes
    </button>
  </nav>

  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- El orden importa: cada archivo usa los objetos globales de los anteriores.
       rca → ejemplo → marca → store → graficos → report → app -->
  <script src="js/rca.js"></script>
  <script src="js/ejemplo.js"></script>
  <script src="js/marca.js"></script>
  <script src="js/store.js"></script>
  <script src="js/graficos.js"></script>
  <script src="js/report.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
